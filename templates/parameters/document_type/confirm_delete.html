{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Confirmar Exclusão</h2>
    <p>Tem certeza que deseja excluir o tipo de documento: <strong>{{ object.description }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
        <a href="{% url 'document-type-list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
