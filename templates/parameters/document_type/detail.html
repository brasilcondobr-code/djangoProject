{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Detalhes do Tipo de Documento</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Descrição:</strong> {{ document_type.description }}</p>
            <p><strong>Ativo:</strong> {{ document_type.is_active|yesno:"Sim,Não" }}</p>
        </div>
    </div>
    <div class="mt-3">
        <a href="{% url 'document-type-list' %}" class="btn btn-secondary">Voltar</a>
        <a href="{% url 'document-type-update' document_type.pk %}" class="btn btn-warning">Editar</a>
    </div>
</div>
{% endblock %}
